<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collective frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pw-frame: 1440px;
      --pw-gutter: 48px;
      --pce-bg: #050606;
      --pce-text: #ffffff;
      --pce-gold: #c89a3d;
      --pce-ratio: 2.253456;
    }
    @media screen and (max-width: 1180px) { :root { --pw-gutter: 34px; } }
    @media screen and (max-width: 860px) { :root { --pw-gutter: 22px; } }
    @media screen and (max-width: 560px) { :root { --pw-gutter: 20px; } }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--pce-bg); }

    #PrimalCollectiveExact-preview {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--pce-bg);
      color: var(--pce-text);
      -webkit-font-smoothing: antialiased;
    }

    #PrimalCollectiveExact-preview .pce__wrap {
      display: grid;
      grid-template-columns: minmax(240px, 296px) minmax(0, 1fr);
      gap: clamp(20px, 2.1vw, 30px);
      align-items: center;
      width: 100%;
      max-width: none;
      min-height: 0;
      margin: 0;
      padding-left: max(
        20px,
        calc((100% - var(--pw-frame, 1440px)) / 2 + var(--pw-gutter, 80px))
      );
      padding-right: 0;
    }

    #PrimalCollectiveExact-preview .pce-copy {
      display: flex;
      min-width: 0;
      padding: 48px 0;
      flex-direction: column;
      justify-content: center;
      align-self: center;
    }

    #PrimalCollectiveExact-preview .pce-eyebrow {
      margin: 0;
      color: var(--pce-gold);
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 15px;
      line-height: 24px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    #PrimalCollectiveExact-preview .pce-heading {
      width: 100%;
      max-width: 11ch;
      margin: 28px 0 0;
      color: var(--pce-text);
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 44px;
      line-height: 0.95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    #PrimalCollectiveExact-preview .pce-description {
      width: 100%;
      max-width: 32ch;
      margin: 22px 0 0;
      color: var(--pce-text);
      font-family: Inter, sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 24px;
    }

    #PrimalCollectiveExact-preview .pce-button {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      min-height: 49px;
      margin-top: 24px;
      padding: 14px 16px 14px 12px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--pce-gold);
      border-radius: 8px;
      background: transparent;
      color: var(--pce-gold);
      text-decoration: none;
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.3;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #PrimalCollectiveExact-preview .pce-button svg {
      width: 16px; height: 16px; flex: 0 0 16px;
      fill: none; stroke: currentColor; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round;
    }

    #PrimalCollectiveExact-preview .pce-media {
      position: relative;
      min-width: 0;
      width: 100%;
      height: auto;
      overflow: hidden;
      background: var(--pce-bg);
      align-self: center;
    }

    #PrimalCollectiveExact-preview .pce-media-scroll {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    #PrimalCollectiveExact-preview .pce-strip {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
    }

    #PrimalCollectiveExact-preview .pce-image,
    #PrimalCollectiveExact-preview img.pce-image {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: unset !important;
      object-position: left center !important;
      vertical-align: top;
    }

    @media screen and (max-width: 1366px) and (min-width: 1025px) {
      #PrimalCollectiveExact-preview .pce__wrap {
        grid-template-columns: minmax(220px, 260px) minmax(0, 1fr);
        gap: 22px;
      }
      #PrimalCollectiveExact-preview .pce-copy { padding-block: 40px; }
      #PrimalCollectiveExact-preview .pce-heading { font-size: clamp(34px, 3.2vw, 40px); }
      #PrimalCollectiveExact-preview .pce-eyebrow { font-size: 13px; letter-spacing: 2px; }
    }

    @media screen and (max-width: 1024px) {
      #PrimalCollectiveExact-preview {
        overflow: visible;
        --pce-strip-h: min(400px, 52vw);
      }
      #PrimalCollectiveExact-preview .pce__wrap {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        min-height: 0;
        padding-left: 0;
        padding-right: 0;
      }
      #PrimalCollectiveExact-preview .pce-copy {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 44px var(--pw-gutter, 32px) 28px;
        justify-content: flex-start;
      }
      #PrimalCollectiveExact-preview .pce-eyebrow {
        font-size: clamp(11px, 1.6vw, 14px);
        line-height: 1.45;
        letter-spacing: clamp(1.5px, 0.28vw, 2.2px);
      }
      #PrimalCollectiveExact-preview .pce-heading {
        max-width: 12ch;
        margin-top: 16px;
        font-size: clamp(34px, 5.5vw, 44px);
        line-height: 0.96;
      }
      #PrimalCollectiveExact-preview .pce-description {
        max-width: 42ch;
        margin-top: 16px;
        font-size: clamp(14px, 2vw, 16px);
        line-height: 1.5;
      }
      #PrimalCollectiveExact-preview .pce-button { margin-top: 20px; }
      #PrimalCollectiveExact-preview .pce-media {
        width: 100%;
        min-height: 0;
        height: var(--pce-strip-h);
        overflow: hidden;
      }
      #PrimalCollectiveExact-preview .pce-media-scroll {
        width: 100%;
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x;
        scrollbar-width: thin;
        scrollbar-color: rgba(200, 154, 61, 0.55) transparent;
      }
      #PrimalCollectiveExact-preview .pce-strip {
        display: block;
        height: 100%;
        width: calc(var(--pce-strip-h) * var(--pce-ratio));
        min-width: calc(var(--pce-strip-h) * var(--pce-ratio));
        max-width: none;
      }
      #PrimalCollectiveExact-preview .pce-image,
      #PrimalCollectiveExact-preview img.pce-image {
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: fill !important;
        object-position: left center !important;
      }
      #PrimalCollectiveExact-preview .pce-media::after {
        content: '';
        position: absolute;
        z-index: 2;
        top: 0; right: 0; bottom: 0;
        width: 40px;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(5,6,6,0) 0%, rgba(5,6,6,.72) 100%);
      }
    }

    @media screen and (max-width: 749px) {
      #PrimalCollectiveExact-preview { --pce-strip-h: min(340px, 78vw); }
      #PrimalCollectiveExact-preview .pce-copy { padding: 36px var(--pw-gutter, 20px) 24px; }
      #PrimalCollectiveExact-preview .pce-heading { max-width: 100%; font-size: clamp(30px, 9vw, 40px); }
      #PrimalCollectiveExact-preview .pce-description { max-width: 100%; font-size: 14px; line-height: 1.5; }
      #PrimalCollectiveExact-preview .pce-button { min-height: 46px; font-size: 11px; letter-spacing: 0.06em; }
    }

    @media screen and (max-width: 429px) {
      #PrimalCollectiveExact-preview { --pce-strip-h: 300px; }
      #PrimalCollectiveExact-preview .pce-copy { padding: 28px var(--pw-gutter, 16px) 20px; }
      #PrimalCollectiveExact-preview .pce-eyebrow { font-size: 11px; letter-spacing: 1.6px; }
      #PrimalCollectiveExact-preview .pce-heading { font-size: 28px; }
      #PrimalCollectiveExact-preview .pce-description { font-size: 13px; }
      #PrimalCollectiveExact-preview .pce-media::after { width: 28px; }
    }
  </style>
</head>
<body>

    <div class="pce__wrap">
      <div class="pce-copy">
        <p class="pce-eyebrow">Trusted By Those Who Demand More</p>

        <p class="pce-description">Elite athletes. Everyday winners. Different journeys. Same mindset.</p>

          <div class="pce-strip">

                  <text x="12" y="296" fill="#fff" font-size="11" font-style="italic">everything."</text>
                  <text x="12" y="340" fill="#C89A3D" font-size="12" font-weight="700">BEN WHITTAKER</text>
                  <text x="12" y="360" fill="#C7CBCE" font-size="11">Professional Boxer</text>
                </g>
                <g transform="translate(332,10)">
                  <rect width="154" height="414" rx="8" fill="#1a1f1c"/>
                  <circle cx="77" cy="150" r="48" fill="#3a4038"/>

                  <text x="12" y="296" fill="#fff" font-size="11" font-style="italic">single day."</text>
                  <text x="12" y="340" fill="#C89A3D" font-size="12" font-weight="700">TOM STOLTMAN</text>
                  <text x="12" y="360" fill="#C7CBCE" font-size="11">World's Strongest Man</text>
                </g>
                <g transform="translate(494,10)">
                  <rect width="154" height="414" rx="8" fill="#1a1f1c"/>

                  <text x="12" y="296" fill="#fff" font-size="11" font-style="italic">Win the night."</text>
                  <text x="12" y="340" fill="#C89A3D" font-size="12" font-weight="700">ADAM AZIM</text>
                  <text x="12" y="360" fill="#C7CBCE" font-size="11">Professional Boxer</text>
                </g>
                <g transform="translate(656,10)">
                  <rect width="154" height="414" rx="8" fill="#1a1f1c"/>
                  <circle cx="77" cy="150" r="48" fill="#3a4038"/>
                  <text x="12" y="280" fill="#fff" font-size="11" font-style="italic">"Fearless in the</text>
                  <text x="12" y="296" fill="#fff" font-size="11" font-style="italic">cage and life."</text>
                  <text x="12" y="340" fill="#C89A3D" font-size="12" font-weight="700">MOLLY MCCANN</text>
                  <text x="12" y="360" fill="#C7CBCE" font-size="11">UFC Fighter</text>
                </g>
                <g transform="translate(818,10)">
                  <rect width="152" height="414" rx="8" fill="#1a1f1c"/>
                  <circle cx="76" cy="150" r="48" fill="#3a4038"/>
                  <text x="12" y="280" fill="#fff" font-size="11" font-style="italic">"Young hunger.</text>
                  <text x="12" y="296" fill="#fff" font-size="11" font-style="italic">Pro mindset."</text>
                  <text x="12" y="340" fill="#C89A3D" font-size="12" font-weight="700">RIO NGUMOHA</text>
                  <text x="12" y="360" fill="#C7CBCE" font-size="11">Professional Footballer</text>
                </g>
              </g>
              <rect x="0" y="0" width="978" height="4" fill="#C89A3D"/>

              <text x="12" y="422" fill="#C89A3D" font-size="12" font-family="Montserrat,sans-serif" font-weight="700">BOTTOM EDGE</text>
            </svg>
          </div>
        </div>
      </div>

  </section>
</body>
</html>
