<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Primal Collective — responsive preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --pw-frame:1440px;
    --pw-gutter:48px;
    --pce-bg:#050606;
    --pce-text:#ffffff;
    --pce-gold:#c89a3d;
  }
  @media (max-width:1180px){ :root{ --pw-gutter:34px; } }
  @media (max-width:860px){ :root{ --pw-gutter:22px; } }
  @media (max-width:560px){ :root{ --pw-gutter:20px; } }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#111;}
  body{font-family:Inter,system-ui,sans-serif;}
  .toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#1b1f22;color:#fff;font:12px/1.3 Inter,system-ui,sans-serif;}
  .toolbar button{border:1px solid #444;background:#2a2f33;color:#fff;border-radius:6px;padding:8px 10px;cursor:pointer;}
  .toolbar button.active{border-color:#c89a3d;color:#c89a3d;}
  .frame-wrap{display:flex;justify-content:center;padding:16px;background:#0a0a0a;}
  .frame{width:100%;max-width:1440px;border:1px solid #333;background:var(--pce-bg);overflow:hidden;transition:width .2s ease;}

  #PrimalCollectiveExact-preview{
    width:100%;margin:0;padding:0;overflow:visible;
    background:var(--pce-bg);color:var(--pce-text);
    -webkit-font-smoothing:antialiased;
  }
  #PrimalCollectiveExact-preview .pce__wrap{
    display:grid;
    grid-template-columns:minmax(240px,296px) minmax(0,1fr);
    gap:clamp(20px,2vw,30px);
    align-items:center;
    width:100%;max-width:none;min-height:0;margin:0;
    padding-left:max(20px, calc((100% - var(--pw-frame)) / 2 + var(--pw-gutter)));
    padding-right:0;
  }
  #PrimalCollectiveExact-preview .pce-copy{
    display:flex;min-width:0;padding:48px 0;flex-direction:column;justify-content:center;align-self:center;
  }
  #PrimalCollectiveExact-preview .pce-eyebrow{
    margin:0;color:var(--pce-gold);font-family:Montserrat,sans-serif;font-weight:700;
    font-size:15px;line-height:24px;letter-spacing:2.5px;text-transform:uppercase;
  }
  #PrimalCollectiveExact-preview .pce-heading{
    width:100%;max-width:11ch;margin:28px 0 0;color:var(--pce-text);
    font-family:Montserrat,sans-serif;font-weight:700;font-size:44px;line-height:.95;
    letter-spacing:0;text-transform:uppercase;
  }
  #PrimalCollectiveExact-preview .pce-description{
    width:100%;max-width:32ch;margin:22px 0 0;color:var(--pce-text);
    font-family:Inter,sans-serif;font-weight:400;font-size:16px;line-height:24px;
  }
  #PrimalCollectiveExact-preview .pce-button{
    display:inline-flex;width:max-content;max-width:100%;min-height:49px;margin-top:24px;
    padding:14px 16px 14px 12px;align-items:center;justify-content:space-between;gap:12px;
    border:1px solid var(--pce-gold);border-radius:8px;background:transparent;color:var(--pce-gold);
    text-decoration:none;font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;
    line-height:1.3;letter-spacing:.08em;text-transform:uppercase;
  }
  #PrimalCollectiveExact-preview .pce-button svg{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  #PrimalCollectiveExact-preview .pce-media{position:relative;min-width:0;width:100%;height:auto;overflow:visible;background:var(--pce-bg);align-self:center;}
  #PrimalCollectiveExact-preview .pce-image{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;object-fit:contain!important;object-position:center right!important;}

  @media screen and (max-width:1366px) and (min-width:1025px){
    #PrimalCollectiveExact-preview .pce__wrap{grid-template-columns:minmax(220px,260px) minmax(0,1fr);gap:24px;}
    #PrimalCollectiveExact-preview .pce-copy{padding:40px 0;}
    #PrimalCollectiveExact-preview .pce-heading{font-size:clamp(34px,3.2vw,40px);}
    #PrimalCollectiveExact-preview .pce-description{font-size:15px;line-height:22px;}
  }
  @media screen and (max-width:1024px){
    #PrimalCollectiveExact-preview .pce__wrap{display:flex;flex-direction:column;align-items:stretch;gap:0;min-height:0;padding-left:0;padding-right:0;}
    #PrimalCollectiveExact-preview .pce-copy{width:100%;padding:clamp(36px,5vw,52px) var(--pw-gutter) clamp(24px,4vw,36px);justify-content:flex-start;}
    #PrimalCollectiveExact-preview .pce-eyebrow{font-size:clamp(12px,1.5vw,14px);letter-spacing:clamp(1.6px,.25vw,2.2px);}
    #PrimalCollectiveExact-preview .pce-heading{max-width:12ch;margin-top:16px;font-size:clamp(34px,5.5vw,44px);line-height:.96;}
    #PrimalCollectiveExact-preview .pce-description{max-width:42ch;margin-top:16px;font-size:clamp(14px,2vw,16px);line-height:1.5;}
    #PrimalCollectiveExact-preview .pce-button{margin-top:20px;}
    #PrimalCollectiveExact-preview .pce-image{object-position:center center!important;}
  }
  @media screen and (max-width:749px){
    #PrimalCollectiveExact-preview .pce-copy{padding:32px var(--pw-gutter) 22px;}
    #PrimalCollectiveExact-preview .pce-heading{max-width:100%;font-size:clamp(28px,8.5vw,40px);}
    #PrimalCollectiveExact-preview .pce-description{max-width:100%;font-size:14px;line-height:1.5;}
    #PrimalCollectiveExact-preview .pce-button{min-height:46px;margin-top:18px;font-size:11px;}
  }
  @media screen and (max-width:429px){
    #PrimalCollectiveExact-preview .pce-copy{padding:28px var(--pw-gutter) 18px;}
    #PrimalCollectiveExact-preview .pce-eyebrow{font-size:11px;letter-spacing:1.6px;}
    #PrimalCollectiveExact-preview .pce-heading{font-size:28px;}
    #PrimalCollectiveExact-preview .pce-description{font-size:13px;}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <strong>Viewport:</strong>
    <button type="button" data-w="1440" class="active">Web 1440</button>
    <button type="button" data-w="1194">iPad Pro LS 1194</button>
    <button type="button" data-w="1024">iPad LS 1024</button>
    <button type="button" data-w="834">iPad Pro PT 834</button>
    <button type="button" data-w="768">iPad PT 768</button>
    <button type="button" data-w="390">Mobile 390</button>
  </div>
  <div class="frame-wrap">
    <div class="frame" id="frame">
      <section id="PrimalCollectiveExact-preview" class="primal-collective-exact">
        <div class="pce__wrap">
          <div class="pce-copy">
            <p class="pce-eyebrow">Trusted By Those Who Demand More</p>
            <h2 class="pce-heading">The Primal Collective</h2>
            <p class="pce-description">Elite athletes. Everyday winners. Different journeys. Same mindset.</p>
            <a class="pce-button" href="#"><span>Meet The Primal Collective</span>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
            </a>
          </div>
          <div class="pce-media">
            <img class="pce-image" src="assets/collective.svg" width="978" height="434" alt="Athlete strip preview">
          </div>
        </div>
      </section>
    </div>
  </div>
  <script>
    const frame = document.getElementById('frame');
    document.querySelectorAll('.toolbar button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.style.width = btn.dataset.w + 'px';
      });
    });
  </script>
</body>
</html>
